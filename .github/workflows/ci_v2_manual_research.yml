name: CI V2 Manual Research Candidate

on:
  workflow_dispatch:
    inputs:
      baseline_key:
        description: Reviewed baseline registry key (initial registry is empty)
        required: true
        type: string
      profile:
        description: Formal live mode is blocked pending provenance contract evolution
        required: true
        default: formal
        type: choice
        options:
          - formal
          - pinned-research
      sys_revision:
        description: Exact SPHinXsys commit (moving refs are rejected)
        required: true
        default: 4e686ee357de1cb798ac47eb760dd79e2fb407ff
        type: string
      sim_revision:
        description: Exact SPHinXsim commit (moving refs are rejected)
        required: true
        default: 9cdae783e3ef3f8926c2174a0db89e96846befad
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      BASELINE_KEY: ${{ inputs.baseline_key }}
      PROFILE: ${{ inputs.profile }}
      SYS_REVISION: ${{ inputs.sys_revision }}
      SIM_REVISION: ${{ inputs.sim_revision }}
    steps:
      - name: Check out trusted workflow implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - name: Select exact frozen interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Validate manual scope and trusted bootstrap configuration
        run: >-
          python -B scripts/ci_v2_manual_research.py plan
          --key "$BASELINE_KEY" --profile "$PROFILE"
          --sys-revision "$SYS_REVISION" --sim-revision "$SIM_REVISION"
          --output "$RUNNER_TEMP/p5a"
      - name: Prepare pinned extraction runtime
        run: |
          git -c credential.helper= clone --no-checkout https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -r configs/ci_v2_parser_requirements.txt
          tools/treesitter-chunker/.venv/bin/python -m pip install -c configs/ci_v2_parser_requirements.txt -e tools/treesitter-chunker
      - name: Restore, build and evaluate research candidate
        run: >-
          tools/treesitter-chunker/.venv/bin/python -B scripts/ci_v2_manual_research.py execute-plan
          --plan "$RUNNER_TEMP/p5a/plan.json"
          --work "$RUNNER_TEMP/p5a-work" --output "$RUNNER_TEMP/p5a/run"
      - name: Upload candidate evidence or explicit failure report
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p5a/*.json
            ${{ runner.temp }}/p5a/run
            ${{ runner.temp }}/p5a/candidate.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Record storage receipt and research restrictions
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              'Research candidate only; automatic approval/reuse=false; production promotion=NOT_AUTHORIZED.\n'
              + 'Artifact ID: ' + os.environ['ARTIFACT_ID'] + '\n'
              + 'Transport digest: ' + os.environ['ARTIFACT_DIGEST'] + '\n')
          PY
